# k3s ships Traefik as its ingress controller.
# Cloudflare Tunnel (deploy/cluster/cloudflared.yaml) sends all hostnames to Traefik,
# and Traefik routes by Host header to the right app.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  namespace: portfolio
spec:
  ingressClassName: traefik
  rules:
    - host: duchongle.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: portfolio, port: { name: http } }
    - host: www.duchongle.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: portfolio, port: { name: http } }
